name: Dependency update

on:
  schedule:
    # Runs at 06:00 UTC on the 1st of every month
    - cron: "0 6 1 * *"
  # Allows running the workflow manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  prek-autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the built-in GITHUB_TOKEN permission to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Ensure checkout points to the branch being targeted, not detached HEAD
          ref: ${{ github.ref_name }}

      - name: Install prek
        uses: j178/prek-action@v1

      - name: Check and update prek hooks
        run: |
          prek update --cooldown-days 7

          # Only proceed if prek.toml was modified
          if ! git diff --quiet prek.toml; then
            echo "Updates found, committing changes..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add prek.toml
            git commit -m "build(ci): Updated prek hooks versions [bot]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "All prek hooks are already up to date."
          fi
